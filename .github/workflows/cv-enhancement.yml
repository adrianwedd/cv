name: CV Enhancement Pipeline

# Evidence-driven CV pipeline with explicit stage semantics:
#   ingest -> propose (AI) -> verify/apply -> validate (hard gate) -> render -> publish
#
# Stage outcomes are real: the AI stage reports SUCCESS / SKIPPED / FAILED and the
# commit message states exactly what happened. A failed stage never masquerades
# as a success downstream.
#
# Triggers — meaningful events, not a daily rewrite:
#   - workflow_dispatch: explicit refresh (optionally proposals-only dry run)
#   - repository_dispatch (cv-evidence-changed): sent by the activity tracker
#     when GitHub activity changes materially
#   - schedule: weekly maintenance run (Mondays 21:00 UTC)

concurrency:
  group: cv-pipeline
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 21 * * 1'
  repository_dispatch:
    types: [cv-evidence-changed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate proposals only — do not apply, render, or publish'
        required: false
        default: false
        type: boolean

env:
  TIMEZONE: 'Australia/Tasmania'
  AI_PROVIDER: openrouter
  AI_MODEL: deepseek/deepseek-v4-flash

jobs:
  pipeline:
    name: Enhance, Validate, Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: cd .github/scripts && npm ci

      - name: Unit tests
        run: cd .github/scripts && npm test

      - name: Browser libraries (PDF rendering)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libxkbcommon0 libgbm-dev

      # ── Stage 1: evidence ingestion ─────────────────────────────────────────
      - name: Ingest — GitHub data mining and narratives
        id: ingest
        run: |
          cd .github/scripts
          if node github-data-miner.js && node narrative-generator.js; then
            echo "status=SUCCESS" >> "$GITHUB_OUTPUT"
            # Keep only the newest snapshot per directory — no unbounded growth
            for dir in ../../data/intelligence ../../data/narratives; do
              ls -t "$dir"/*-narratives-*.json "$dir"/*-intelligence-*.json 2>/dev/null | tail -n +2 | xargs -r rm -f
            done
          else
            # Enhancement can still run on previously collected evidence, but the
            # outcome is recorded and reported — not silently upgraded.
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            echo "::warning::Evidence ingestion failed; proposing from previously collected evidence"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINING_DEPTH: comprehensive
          LOOKBACK_DAYS: 90

      # ── Stage 2: AI proposals (never touches base-cv.json) ──────────────────
      - name: Propose — evidence-bounded AI enhancement
        id: propose
        run: |
          cd .github/scripts
          set +e
          timeout 600 node enhance.js
          EXIT=$?
          set -e
          STATUS=$(jq -r '.status // "FAILED"' ../../data/ai-enhancements.json 2>/dev/null || echo FAILED)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "AI proposal stage: $STATUS (exit $EXIT)"
          # FAILED proposals never block the pipeline — the site can still be
          # validated and re-rendered from curated content — but the status is
          # carried into the commit message, not laundered into success.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # ── Stage 3: verification decides what lands ────────────────────────────
      - name: Verify — apply only evidence-supported proposals
        id: verify
        if: inputs.dry_run != true
        run: |
          cd .github/scripts
          node verify-proposals.js | tee /tmp/verify.log
          APPLIED=$(grep -oE '^APPLIED=[0-9]+' /tmp/verify.log | cut -d= -f2)
          echo "applied=${APPLIED:-0}" >> "$GITHUB_OUTPUT"

      # ── Stage 4: hard validation gate ───────────────────────────────────────
      - name: Validate — content integrity gate
        run: |
          node tests/validate-json.test.js
          cd .github/scripts
          node ai-hallucination-detector.js
          node content-guardian.js --validate
          node keyword-scorer.js --threshold 35 --report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Stage 5: render site + PDFs ─────────────────────────────────────────
      - name: Render — website and PDFs
        if: inputs.dry_run != true
        run: |
          cd .github/scripts
          timeout 300 node cv-generator.js
          cd ../..
          test -f dist/index.html
          # Copy generated output into the working tree for Pages deployment
          cp -r dist/assets/. assets/
          cp -r dist/data/. data/
          cp dist/index.html index.html

      - name: Lint generated JavaScript
        if: inputs.dry_run != true
        run: cd .github/scripts && npm run lint

      # ── Stage 6: publish (honest commit message) ────────────────────────────
      - name: Publish — commit if content changed
        if: inputs.dry_run != true
        run: |
          git config --local user.email "cv-pipeline@adrianwedd.com"
          git config --local user.name "cv-pipeline"

          git add data/ index.html assets/ CNAME

          # Ignore runs where nothing but volatile metadata moved: if the only
          # changes are generation timestamps and byte-jittered PDFs, skip the
          # commit entirely instead of manufacturing daily churn.
          if git diff --cached --quiet; then
            echo "No content changes — nothing to publish"
            exit 0
          fi
          MEANINGFUL=$(git diff --cached --numstat -- ':!assets/*.pdf' ':!data/ai-enhancements.json' | wc -l)
          if [ "$MEANINGFUL" -eq 0 ] && [ "${{ steps.verify.outputs.applied || '0' }}" = "0" ]; then
            echo "Only volatile files changed (PDF byte-jitter) — nothing to publish"
            exit 0
          fi

          INGEST="${{ steps.ingest.outputs.status }}"
          PROPOSE="${{ steps.propose.outputs.status }}"
          APPLIED="${{ steps.verify.outputs.applied || '0' }}"

          if [ "$PROPOSE" = "SUCCESS" ] && [ "$APPLIED" -gt 0 ]; then
            HEADLINE="cv: apply $APPLIED verified AI-proposed improvement(s)"
          else
            HEADLINE="cv: refresh generated site from curated content"
          fi

          git commit -m "$HEADLINE

          Trigger: ${{ github.event_name }}
          Evidence ingestion: $INGEST
          AI proposals: $PROPOSE (provider: ${{ env.AI_PROVIDER }}, model: ${{ env.AI_MODEL }})
          Proposals applied after verification: $APPLIED
          Validation gate: PASSED (deploys are blocked when it fails)"

          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run summary
        if: always()
        run: |
          {
            echo "# CV Pipeline Result"
            echo ""
            echo "| Stage | Outcome |"
            echo "|-------|---------|"
            echo "| Evidence ingestion | ${{ steps.ingest.outputs.status || 'not run' }} |"
            echo "| AI proposals | ${{ steps.propose.outputs.status || 'not run' }} |"
            echo "| Applied after verification | ${{ steps.verify.outputs.applied || '0' }} |"
            echo ""
            echo "Statuses above are measured, not assumed. See data/proposal-review.json for per-proposal verdicts."
          } >> "$GITHUB_STEP_SUMMARY"
