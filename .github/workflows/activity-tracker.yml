name: GitHub Activity Tracker

# Evidence ingestion, stage 1 of the CV pipeline.
#
# Collects real cross-account GitHub activity via activity-collector.js (NOT
# this repo's own git log, which is dominated by automation commits and
# measures nothing about Adrian). Commits only when the evidence materially
# changed, and triggers the CV enhancement pipeline via repository_dispatch
# when it does.

concurrency:
  group: cv-pipeline
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 20 * * *'   # daily check — cheap, no AI, commits only on material change
  workflow_dispatch:

jobs:
  collect:
    name: Collect and compare activity evidence
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Snapshot previous evidence
        run: cp data/github-activity.json /tmp/previous-activity.json 2>/dev/null || echo '{}' > /tmp/previous-activity.json

      - name: Collect cross-repo activity
        run: node .github/scripts/activity-collector.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOKBACK_DAYS: '30'

      - name: Detect material change
        id: delta
        run: |
          OLD=/tmp/previous-activity.json
          NEW=data/github-activity.json
          MATERIAL=false
          REASON="none"

          if ! jq -e '.summary.total_commits' "$OLD" >/dev/null 2>&1; then
            MATERIAL=true; REASON="no previous evidence snapshot"
          else
            OC=$(jq '.summary.total_commits' "$OLD"); NC=$(jq '.summary.total_commits' "$NEW")
            OR=$(jq '.summary.active_repositories // 0' "$OLD"); NR=$(jq '.summary.active_repositories' "$NEW")
            OL=$(jq '[.languages | keys[]] | sort | join(",")' "$OLD" 2>/dev/null || echo '""')
            NL=$(jq '[.languages | keys[]] | sort | join(",")' "$NEW")
            DIFF=$(( NC > OC ? NC - OC : OC - NC ))
            # Material: commit volume moved >=25% and >=10 commits, the active-repo
            # count changed, or the language mix changed.
            if [ "$DIFF" -ge 10 ] && [ "$DIFF" -ge $(( (OC > 0 ? OC : 1) / 4 )) ]; then
              MATERIAL=true; REASON="commit volume changed by $DIFF (${OC} -> ${NC})"
            elif [ "$NR" != "$OR" ]; then
              MATERIAL=true; REASON="active repositories ${OR} -> ${NR}"
            elif [ "$NL" != "$OL" ]; then
              MATERIAL=true; REASON="language mix changed"
            fi
          fi

          echo "material=$MATERIAL" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "Material change: $MATERIAL ($REASON)"

      - name: Commit evidence update
        if: steps.delta.outputs.material == 'true'
        run: |
          git config --local user.email "activity-tracker@adrianwedd.com"
          git config --local user.name "cv-activity-tracker"
          git add data/github-activity.json data/activity-summary.json
          git commit -m "evidence: activity update — ${{ steps.delta.outputs.reason }}"
          git push

      - name: Restore unchanged evidence
        if: steps.delta.outputs.material != 'true'
        run: git checkout -- data/ 2>/dev/null || true

      - name: Trigger CV enhancement pipeline
        if: steps.delta.outputs.material == 'true'
        run: |
          # NOTE: events raised with the workflow's own GITHUB_TOKEN do not start
          # new workflow runs, so the dispatch must use a PAT.
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"cv-evidence-changed","client_payload":{"reason":"${{ steps.delta.outputs.reason }}"}}'
          echo "Dispatched cv-evidence-changed: ${{ steps.delta.outputs.reason }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "# Activity Tracker Result"
            echo "- Material change: **${{ steps.delta.outputs.material }}**"
            echo "- Reason: ${{ steps.delta.outputs.reason }}"
            echo "- No change means no commit and no downstream pipeline run — by design."
          } >> "$GITHUB_STEP_SUMMARY"
